# Mirrors Waydroid's Android images into the `android-images` release and
# publishes OTA channel files on the `ota` branch, so setup-waydroid.sh
# downloads from GitHub instead of SourceForge (see mirror_android_images.py).
name: Mirror Android images

on:
  workflow_dispatch:
    inputs:
      system_types:
        description: "System image types to mirror, space-separated (VANILLA, GAPPS)"
        required: false
        default: "VANILLA"
  schedule:
    # Wednesdays: Waydroid publishes new images every few weeks.
    - cron: "0 7 * * 3"
  push:
    branches: [main]
    paths:
      - ".github/scripts/mirror_android_images.py"
      - ".github/workflows/mirror-android-images.yml"

permissions:
  contents: write

concurrency:
  group: mirror-android-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the previously published channel files
        run: |
          mkdir -p previous
          if git fetch --depth=1 origin ota; then
            git --work-tree=previous checkout FETCH_HEAD -- .
          fi

      - name: Mirror images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SYSTEM_TYPES: ${{ inputs.system_types || vars.MIRROR_SYSTEM_TYPES || 'VANILLA' }}
          ARCHES: "arm64_only arm64"
          PREVIOUS_DIR: ${{ github.workspace }}/previous
        run: |
          mkdir -p "$RUNNER_TEMP/work" ota
          cd "$RUNNER_TEMP/work"
          python3 "$GITHUB_WORKSPACE/.github/scripts/mirror_android_images.py" "$GITHUB_WORKSPACE/ota"

      - name: Publish the ota branch
        run: |
          cd ota
          cat > README.md <<EOF
          # Waydroid OTA channel (mirror)

          Generated by [mirror-android-images.yml](https://github.com/${{ github.repository }}/blob/main/.github/workflows/mirror-android-images.yml).
          Same entries as https://ota.waydro.id, with downloads served from the
          [android-images](https://github.com/${{ github.repository }}/releases/tag/android-images) release.
          EOF
          git init -q -b ota
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "OTA channel files ($(date -u +%Y-%m-%d))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ota
