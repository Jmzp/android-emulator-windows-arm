# Static checks for the Bash, PowerShell, Python and C sources on every push and pull request.
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          shellcheck --version
          find wsl -name '*.sh' -print0 | xargs -0 shellcheck

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Compile Python helpers
        run: python3 -m py_compile wsl/*.py wsl/clipboard/*.py .github/scripts/*.py

  clipboard-module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the Weston clipboard module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libweston-13-dev pkg-config
          gcc -shared -fPIC -O2 -Wall -Wextra -Wno-unused-parameter -Werror \
            -o clipboard-bridge.so wsl/clipboard/clipboard-bridge.c $(pkg-config --cflags --libs libweston-13)

  psscriptanalyzer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($results) { throw "PSScriptAnalyzer found $($results.Count) issue(s)" }
